name: Publish
on:
  release: { types: [published] }
permissions: { contents: read, id-token: write }
jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@1e60f620b9541dce0c2b4f5374f5406e7d51e2b5 # v4
        with: { node-version: 24, registry-url: https://registry.npmjs.org, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm publish --workspace @mariosakka/sprouts --access public --provenance
      - run: npm publish --workspace @mariosakka/sprouts-vue --access public --provenance
      - run: npm publish --workspace @mariosakka/sprouts-react --access public --provenance
      - run: npm publish --workspace @mariosakka/sprouts-angular --access public --provenance
      - run: npm publish --workspace @mariosakka/sprouts-renderer --access public --provenance
