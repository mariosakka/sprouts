name: Publish
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to verify and publish
        required: true
        type: string
permissions: { contents: read, id-token: write }
jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, registry-url: https://registry.npmjs.org, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run verify:release -- "${{ inputs.tag_name }}"
      - run: npm run publish:workspace -- @mariosakka/sprouts
      - run: npm run publish:workspace -- @mariosakka/sprouts-vue
      - run: npm run publish:workspace -- @mariosakka/sprouts-react
      - run: npm run publish:workspace -- @mariosakka/sprouts-angular
      - run: npm run publish:workspace -- @mariosakka/sprouts-renderer
