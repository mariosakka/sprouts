name: Publish
on:
  release: { types: [published] }
permissions: { contents: read, id-token: write }
jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, registry-url: https://registry.npmjs.org, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run verify:release -- "${{ github.event.release.tag_name }}"
      - run: npm publish --workspace @mariosakka/sprouts --access public
      - run: npm publish --workspace @mariosakka/sprouts-vue --access public
      - run: npm publish --workspace @mariosakka/sprouts-react --access public
      - run: npm publish --workspace @mariosakka/sprouts-angular --access public
      - run: npm publish --workspace @mariosakka/sprouts-renderer --access public
