name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
permissions: { contents: read }
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
      - uses: actions/setup-node@1e60f620b9541dce0c2b4f5374f5406e7d51e2b5 # v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm pack --workspace @mariosakka/sprouts --dry-run
      - run: npm pack --workspace @mariosakka/sprouts-vue --dry-run
      - run: npm pack --workspace @mariosakka/sprouts-react --dry-run
      - run: npm pack --workspace @mariosakka/sprouts-angular --dry-run
      - run: npm pack --workspace @mariosakka/sprouts-renderer --dry-run
