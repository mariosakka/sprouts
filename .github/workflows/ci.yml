name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
permissions: { contents: read }
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.2 detect --source=/repo --redact
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Documentation sync
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-docs-sync.mjs "$BASE"
      - run: npm run check
      - run: npm pack --workspace @mariosakka/sprouts --dry-run
      - run: npm pack --workspace @mariosakka/sprouts-vue --dry-run
      - run: npm pack --workspace @mariosakka/sprouts-react --dry-run
      - run: npm pack --workspace @mariosakka/sprouts-angular --dry-run
      - run: npm pack --workspace @mariosakka/sprouts-renderer --dry-run
