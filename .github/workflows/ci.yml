name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
permissions: { contents: read }
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.2 detect --source=/repo --redact
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm pack --workspace @mariosakka/sprouts --dry-run
      - run: npm pack --workspace @mariosakka/sprouts-vue --dry-run
      - run: npm pack --workspace @mariosakka/sprouts-react --dry-run
      - run: npm pack --workspace @mariosakka/sprouts-angular --dry-run
      - run: npm pack --workspace @mariosakka/sprouts-renderer --dry-run
